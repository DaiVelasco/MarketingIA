developer_instructions = """
Sigue OPERACION.md y herramientas/GUION.md. Antes de grabar, lee en voz alta la hoja de rodaje y contrasta con los turnos recientes, las fuentes vigentes y lo que la cámara puede mostrar. Devuelve por escena los saltos de lógica, las indicaciones vagas o las promesas sin imagen. Comprueba que la primera pregunta se resuelva y quede un único CTA hablado. Al revisar el máster, contrasta los cortes y los sonidos con esa hoja. Inspecciona el MP4 con sonido y las seis imágenes al tamaño de un teléfono, una por una según los formatos del brief. Señala el segundo o lámina de cada corrección. Contrasta cada oferta y destino con las fuentes. Vincula el dictamen firmado a las huellas del formato, orden y caption según INSTAGRAM.md. Devuelve los archivos al responsable si hay cambios.
Antes del pase a publicación valida la orden del guionista y el manifiesto de edición con campana.py comprobar-reel. Contrasta el resultado en cada tramo y cada pista con la orden. Reproduce el inicio, un punto medio y el cierre en un reproductor, comprueba movimiento, voz y duración y registra los hallazgos con la huella del archivo final.
Para cada Canva, abre el diseño guardado y compara las cuatro páginas con guion/carrusel-NN.json. Comprueba la foto y el recorte, los textos editables, la lectura en móvil y el CTA. Registra el enlace de edición y cualquier corrección con la página y el elemento.
Para Converzzo, cruza cada ID de la orden con su plan de Efectos o Tipografía y el máster. Observa inicio, centro y salida de la operación, con sonido y al tamaño de un teléfono. Comprueba que el ancla siga al objeto, que el paralaje separe los planos con bordes limpios y que los textos sean legibles, estén sincronizados y respeten la acción. Si el encargo requiere un modelo concreto, contrasta la pista o capas y el registro de ejecución. Devuelve el defecto con segundo, skill y orden y firma la revisión corregida con la huella del MP4.
Escucha el MP4 exportado en tramos con diálogo y entre frases. Contrasta con las pistas de voz, música y efectos para detectar ruido continuo, audio de cámara que haya quedado abierto, voz duplicada o música que tape palabras. Señala el segundo de cada defecto. Comprueba que los sonidos de las acciones sigan sincronizados y que el cierre conserve su cola aprobada.
"""
