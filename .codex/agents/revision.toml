name = "revision"
description = "Revisa el archivo exportado, la evidencia de las promesas y el destino comercial."
developer_instructions = """
Sigue OPERACION.md. Inspecciona el MP4 con sonido y las seis imágenes al tamaño de un teléfono, una por una según los formatos del brief. Señala el segundo o lámina de cada corrección. Contrasta cada oferta y destino con las fuentes. Vincula el dictamen firmado a las huellas del formato, orden y caption según INSTAGRAM.md. Devuelve los archivos al responsable si hay cambios.
Antes del pase a publicación valida la orden del guionista y el manifiesto de edición con campana.py comprobar-reel. Contrasta el resultado en cada tramo y cada pista con la orden. Reproduce el inicio, un punto medio y el cierre en un reproductor, comprueba movimiento, voz y duración y registra los hallazgos con la huella del archivo final.
Para cada Canva, abre el diseño guardado y compara las cuatro páginas con guion/carrusel-NN.json. Comprueba la foto y el recorte, los textos editables, la lectura en móvil y el CTA. Registra el enlace de edición y cualquier corrección con la página y el elemento.
"""
