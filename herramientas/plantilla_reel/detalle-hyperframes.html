<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Detalle de cámara</title>
<style>
*{box-sizing:border-box}html,body,main{margin:0;width:1080px;height:1920px;overflow:hidden;background:#17201e}
#capa,#detalle{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden}
img{width:1080px;height:1920px;object-fit:cover}
#detalle{mask-size:535px 480px;mask-position:52% 53%;mask-repeat:no-repeat;mask-mode:luminance;opacity:0}
#zoom{transform-origin:57% 45%}
</style><script src="gsap.min.js"></script></head><body>
<main data-composition-id="detalle" data-start="0" data-duration="DURACION" data-width="1080" data-height="1920" data-fps="30">
<div id="capa"><img id="base" alt=""></div><div id="detalle"><img id="zoom" alt=""></div>
</main><script>
const tl=gsap.timeline({paused:true});
tl.fromTo('#capa',{scale:1.005,transformOrigin:'55% 48%'},{scale:1.075,duration:DURACION,ease:'sine.inOut'},0);
tl.fromTo('#zoom',{scale:1.1},{scale:1.13,duration:DURACION,ease:'sine.inOut'},0);
tl.fromTo('#detalle',{opacity:0},{opacity:.83,duration:.18,ease:'sine.out'},0);
tl.to('#detalle',{opacity:0,duration:.23,ease:'sine.in'},.48);
window.__timelines={detalle:tl};
window.fotograma=async f=>{
  const material='camara/'+String(f).padStart(3,'0')+'.jpg';
  const mask='papel/'+String(Math.min(23,f)).padStart(3,'0')+'.png';
  const a=document.querySelector('#base'),b=document.querySelector('#zoom');
  a.src=material;b.src=material;
  const m=new Image();m.src=mask;
  await Promise.all([a.decode(),b.decode(),m.decode()]);document.querySelector('#detalle').style.maskImage='url('+mask+')';
  tl.seek(f/30);
};
</script></body></html>
